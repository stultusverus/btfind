<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>btfind dashboard</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; max-width: 1200px; margin: 0 auto; }
h1 { font-size: 1.5rem; margin-bottom: 16px; color: #58a6ff; }
.search-bar { display: flex; gap: 8px; margin-bottom: 20px; }
.search-bar input { flex: 1; padding: 8px 12px; background: #161b22; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font-size: 14px; }
.search-bar input:focus { outline: none; border-color: #58a6ff; }
.search-bar button { padding: 8px 16px; background: #238636; border: none; border-radius: 6px; color: white; cursor: pointer; font-size: 14px; }
.search-bar button:hover { background: #2ea043; }
.stats { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.stat-card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 12px 16px; min-width: 150px; }
.stat-card .label { font-size: 12px; color: #8b949e; }
.stat-card .value { font-size: 20px; font-weight: 600; color: #58a6ff; }
.results { display: flex; flex-direction: column; gap: 8px; }
.result-card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 12px 16px; }
.result-card .name { font-weight: 600; margin-bottom: 4px; word-break: break-all; }
.result-card .meta { font-size: 12px; color: #8b949e; }
.result-card .hash { font-family: monospace; font-size: 11px; color: #6e7681; word-break: break-all; margin-top: 4px; }
.result-card .magnet { font-size: 11px; margin-top: 4px; }
.result-card .magnet a { color: #58a6ff; word-break: break-all; }
.error { color: #f85149; margin-top: 8px; }
.size { white-space: nowrap; }
</style>
</head>
<body>
<h1>btfind dashboard</h1>

<div class="stats" id="stats"></div>

<div class="search-bar">
    <input type="text" id="query" placeholder="Search torrents..." autofocus>
    <button onclick="search()">Search</button>
</div>

<div class="results" id="results"></div>
<div class="error" id="error"></div>

<script>
async function loadStats() {
    try {
        const resp = await fetch('/api/stats');
        const data = await resp.json();
        document.getElementById('stats').innerHTML =
            `<div class="stat-card"><div class="label">Torrents</div><div class="value">${data.total_torrents}</div></div>` +
            `<div class="stat-card"><div class="label">With metadata</div><div class="value">${data.total_metadata_complete}</div></div>` +
            `<div class="stat-card"><div class="label">Files</div><div class="value">${data.total_files}</div></div>`;
    } catch(e) {
        console.error(e);
    }
}

async function search() {
    const query = document.getElementById('query').value.trim();
    const err = document.getElementById('error');
    const results = document.getElementById('results');
    err.textContent = '';
    results.innerHTML = '<div style="color:#8b949e">searching...</div>';

    try {
        const resp = await fetch(`/api/search?q=${encodeURIComponent(query)}&limit=50`);
        if (!resp.ok) { err.textContent = 'search failed'; return; }
        const data = await resp.json();
        if (data.length === 0) {
            results.innerHTML = '<div style="color:#8b949e">no results</div>';
            return;
        }
        results.innerHTML = data.map(t => {
            const name = t.name || '<unknown>';
            const hash = t.info_hash;
            const size = formatSize(t.total_size);
            return `<div class="result-card">
                <div class="name">${escapeHtml(name)}</div>
                <div class="meta">${t.file_count} files, <span class="size">${size}</span></div>
                <div class="hash">${hash}</div>
                <div class="magnet"><a href="${t.magnet}">magnet link</a></div>
            </div>`;
        }).join('');
    } catch(e) {
        err.textContent = 'search error: ' + e;
    }
}

function formatSize(bytes) {
    if (bytes < 0) return '0 B';
    const u = ['B', 'KB', 'MB', 'GB', 'TB'];
    let s = bytes, i = 0;
    while (s >= 1024 && i < u.length - 1) { s /= 1024; i++; }
    return i === 0 ? bytes + ' B' : s.toFixed(1) + ' ' + u[i];
}

function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

loadStats();
document.getElementById('query').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
</script>
</body>
</html>
