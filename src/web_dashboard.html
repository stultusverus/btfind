<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>btfind dashboard</title>
<link rel="stylesheet" href="/dashboard.css">
</head>
<body>
<main class="shell">
    <header class="topbar">
        <div>
            <h1>btfind dashboard</h1>
            <p class="subtitle">Search torrents with complete metadata.</p>
        </div>
        <button class="ghost" id="refresh" type="button">Refresh</button>
    </header>

    <section class="stats" id="stats" aria-label="Database statistics" aria-busy="true">
        <div class="stat-card skeleton"></div>
        <div class="stat-card skeleton"></div>
        <div class="stat-card skeleton"></div>
        <div class="stat-card skeleton"></div>
    </section>

    <form class="search-panel" id="search-form">
        <div class="field query-field">
            <label for="query">Search</label>
            <input type="search" id="query" placeholder="Torrent names and file paths" autocomplete="off" autofocus>
        </div>
        <div class="field">
            <label for="sort">Sort by</label>
            <select id="sort">
                <option value="rank">Relevance</option>
                <option value="last_seen">Recently seen</option>
                <option value="first_seen">Recently added</option>
                <option value="total_size">Largest</option>
                <option value="name">Name</option>
            </select>
        </div>
        <div class="field">
            <label for="limit">Results per page</label>
            <select id="limit">
                <option value="25">25</option>
                <option value="50" selected>50</option>
                <option value="100">100</option>
                <option value="250">250</option>
            </select>
        </div>
        <button class="filter-toggle ghost" id="filter-toggle" type="button" aria-expanded="false" aria-controls="size-filters">Filters</button>
        <div class="size-filters" id="size-filters">
            <div class="field">
                <label for="min-size">Minimum size</label>
                <input type="text" id="min-size" inputmode="decimal" placeholder="e.g. 700 MB" aria-describedby="size-help">
            </div>
            <div class="field">
                <label for="max-size">Maximum size</label>
                <input type="text" id="max-size" inputmode="decimal" placeholder="e.g. 4 GB" aria-describedby="size-help">
            </div>
            <p class="field-help" id="size-help">Use B, KB, MB, GB, or TB.</p>
        </div>
        <div class="search-actions">
            <button class="primary" id="search-button" type="submit">Search</button>
            <button class="ghost" id="clear-filters" type="button">Clear filters</button>
        </div>
    </form>

    <div class="filter-chips" id="filter-chips" aria-label="Active filters"></div>
    <div class="status" id="status" role="status" aria-live="polite"></div>

    <nav class="pager" id="pager" aria-label="Search results pagination" hidden>
        <div class="pager-status" id="pager-status"></div>
        <div class="pager-actions">
            <button class="ghost" id="prev-page" type="button">Previous</button>
            <button class="ghost" id="next-page" type="button">Next</button>
        </div>
    </nav>

    <section class="results-shell" aria-labelledby="results-heading">
        <h2 class="visually-hidden" id="results-heading">Search results</h2>
        <div class="result-headings" aria-hidden="true">
            <span>Torrent</span><span>Size</span><span>Files</span><span>Last seen</span><span>Actions</span>
        </div>
        <div class="results" id="results" aria-live="polite"></div>
    </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="/dashboard.js" defer></script>
</body>
</html>
